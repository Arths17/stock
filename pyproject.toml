[project]
name = "stockbot"
version = "0.1.0"
description = "Research-first trading bot: backtest signals honestly, then trade tiny size on one Robinhood account."
requires-python = ">=3.11"
dependencies = ["numpy", "pandas"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
